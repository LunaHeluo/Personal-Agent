    deterministic_assertions: [rule:route:job_research, rule:outcome_equals:page_kind:job_detail_candidate, rule:source_url:expected]
    safety_level: standard

  - id: single_block_jd_verified
    suite_id: job-research-trust-fixture-suite
    version: v3
    layer: happy_path
    input_summary: {fixture_state: single_block_snapshot}
    fixture_ids: [single-block-jd-redacted-v1, job-posting-json-ld-redacted-v1]
    expected_outcome: {task_success: true, route: job_research, source_url: "https://careers.example.test/jobs/agent-platform-engineer-42"}
    deterministic_assertions: [rule:route:job_research, rule:outcome_equals:validation_state:verified, rule:source_url:expected]
    safety_level: standard

  - id: error_page_then_valid_jd
    suite_id: job-research-trust-fixture-suite
    version: v3
