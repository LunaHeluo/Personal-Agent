  - id: runtime_revision_stale
    suite_id: job-research-trust-fixture-suite
    version: v3
    layer: edge_case
    input_summary: {fixture_state: runtime_revision_changed}
    fixture_ids: [knowledge-routing-redacted-v1]
    expected_outcome: {task_success: true, route: job_research}
    deterministic_assertions: [rule:route:job_research, rule:outcome_equals:restart_required:true]
