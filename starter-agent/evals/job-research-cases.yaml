  - id: JR-LATEST-001
    suite_id: job-research-trust-fixture-suite
    version: v2
    layer: edge_case
    input_summary: {location: Shanghai, role: Agent Engineer, fixture_state: explicit_freshness}
    fixture_ids: [jd-public-ai-agent-redacted-v1, serpapi-ai-agent-redacted-v1]
